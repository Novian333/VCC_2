
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/app.css">
  <title>Contact Me</title>
</head>
<body>
  <header>
    <nav aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="contact.html" aria-current="page">Contact</a>
    </nav>
  </header>

  <main>
    <h1>Contact Me</h1>
    <p>Thank you for visiting my portfolio.</p>
    <p>If you would like to connect, please contact me through GitHub.</p>

    <p>
      <a href="https://github.com/Novian333" target="_blank"
         rel="noopener noreferrer">Visit my GitHub profile</a>
    </p>

    <section aria-labelledby="message-heading">
      <h2 id="message-heading">Send a Message</h2>
      <form>
        <label for="name">Your Name</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Your Email</label>
        <input type="email" id="email" name="email" required>

        <label for="message">Your Message</label>
        <textarea id="message" name="message" rows="5" required></textarea>

        <button type="submit">Send Message</button>
      </form>
    </section>
  </main>
</body>
</html>
